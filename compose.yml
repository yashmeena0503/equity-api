services:
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: equity
    ports:
      - "3306:3306"
    volumes:
      - ./tmp/mariadb:/var/lib/mysql

  adminer:
    image: adminer:5
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - mariadb
    ports:
      - "8080:8080"

  # TODO: add api container here

  webapp:
    build:
      context: ./webapp
      target: prod
    container_name: webapp
    environment:
      VITE_API_URL: "http://localhost:${PORT}"

  webapp-dev:
    build:
      context: ./webapp
      target: dev
    container_name: webapp-dev
    environment:
      VITE_API_URL: "http://localhost:${PORT}"
    volumes:
      - ./webapp:/app
      # TODO: what the hell does this do
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
